server:
  port: 8080
management:
spring:
  application:
    name: "ms-carga-doc"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  codec:
    max-in-memory-size: 500MB
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
storage:
  base-path: C:/Software/proyectos/ms-carga-doc/uploads

