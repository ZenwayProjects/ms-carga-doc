server:
  port: 8080
management: null
spring:
  application:
    name: "ms-carga-doc"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    active: local
  codec:
    max-in-memory-size: "500MB"
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

storage:
  type: s3

adapters:
  aws:
    s3:
      endpoint: http://127.0.0.1:4566
      region: us-east-1
      bucketName: documentos
